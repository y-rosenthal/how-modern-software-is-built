<title>How Modern Software Is Built</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F4F6F9;
  --surface:#FFFFFF;
  --surface-2:#E9EEF4;
  --ink:#1B2430;
  --ink-2:#4A5666;
  --line:#CBD4DF;
  --accent:#0E7C86;
  --accent-ink:#0A5A62;
  --accent-soft:#D6EEF0;
  --review:#FFF3D1;
  --review-line:#E2B94E;
  --review-ink:#5C4300;
  --note:#EEF2F7;
  --note-line:#8FA3B8;
  --code-bg:#EDF1F5;
  --diagram-hi:#0E7C86;
  --diagram-hi-soft:#D6EEF0;
  --font-display:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#12171E;
    --surface:#1A212B;
    --surface-2:#232C38;
    --ink:#E6EBF1;
    --ink-2:#A6B2C1;
    --line:#384454;
    --accent:#4FC1CB;
    --accent-ink:#8ADCE3;
    --accent-soft:#173A3E;
    --review:#3A2E0E;
    --review-line:#C9A23E;
    --review-ink:#F4E3B0;
    --note:#1F2A36;
    --note-line:#5B7290;
    --code-bg:#0F141A;
    --diagram-hi:#4FC1CB;
    --diagram-hi-soft:#173A3E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#12171E;
  --surface:#1A212B;
  --surface-2:#232C38;
  --ink:#E6EBF1;
  --ink-2:#A6B2C1;
  --line:#384454;
  --accent:#4FC1CB;
  --accent-ink:#8ADCE3;
  --accent-soft:#173A3E;
  --review:#3A2E0E;
  --review-line:#C9A23E;
  --review-ink:#F4E3B0;
  --note:#1F2A36;
  --note-line:#5B7290;
  --code-bg:#0F141A;
  --diagram-hi:#4FC1CB;
  --diagram-hi-soft:#173A3E;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:17px;
  line-height:1.6;
  padding-inline:16px;
  padding-block:0 64px;
}
a{color:var(--accent-ink);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--font-display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(2rem,4vw,2.9rem);font-weight:800;letter-spacing:-0.01em}
h2{font-size:clamp(1.6rem,3vw,2.1rem);font-weight:800;letter-spacing:-0.01em}
h3{font-size:1.35rem;font-weight:700;margin-top:2.6rem;margin-bottom:0.6rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:0.6rem 0.9rem}
h4{font-size:1.05rem;font-weight:700;margin-top:1.6rem;margin-bottom:0.3rem}
p{margin:0 0 1rem}
ul,ol{padding-left:1.4rem;margin:0 0 1rem}
li{margin-bottom:0.35rem}
li>ul,li>ol{margin-top:0.35rem}
strong{font-weight:600}
code,pre,kbd{font-family:var(--font-mono);font-size:0.86em}
code{background:var(--code-bg);padding:0.08em 0.35em;border-radius:4px}
pre{
  background:var(--code-bg);
  border:1px solid var(--line);
  border-radius:8px;
  padding:0.9rem 1.1rem;
  overflow-x:auto;
  line-height:1.5;
  margin:0.6rem 0 1.2rem;
}
pre code{background:none;padding:0;font-size:0.84rem}
hr{border:0;border-top:1px solid var(--line);margin:2.5rem 0}

/* layout */
.page{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:0 48px}
@media (min-width:1100px){
  .page{grid-template-columns:270px minmax(0,1fr)}
  .toc{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow-y:auto;padding-block:32px 40px}
  .toc summary{display:none}
  .toc details>*{display:block}
}
.toc{font-family:var(--font-display);font-size:0.86rem;line-height:1.4}
.toc details{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0.6rem 0.9rem;margin-block:20px 8px}
@media (min-width:1100px){.toc details{border:0;background:transparent;padding:0;margin:0}}
.toc summary{cursor:pointer;font-weight:700;font-size:0.95rem}
.toc .toc-label{font-size:0.7rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-2);margin:0.8rem 0 0.5rem}
.toc ol{list-style:none;padding:0;margin:0}
.toc li{margin:0}
.toc a{display:block;padding:0.22rem 0.5rem;border-radius:6px;text-decoration:none;color:var(--ink)}
.toc a:hover{background:var(--surface-2);color:var(--accent-ink)}
.toc .toc-session>a{font-weight:700;margin-top:0.6rem}
.toc .toc-sub a{color:var(--ink-2);padding-left:1.1rem;font-size:0.82rem}
.toc .toc-appendix>a{font-weight:600}
main{min-width:0;max-width:78ch;padding-block:32px 0}
main>p,main>ul,main>ol,section>p,section>ul,section>ol{max-width:70ch}

/* cover */
.cover{padding:40px 0 24px;border-bottom:1px solid var(--line);margin-bottom:24px}
.eyebrow{font-family:var(--font-display);font-size:0.74rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:0.7rem}
.cover .lede{font-size:1.15rem;color:var(--ink-2);max-width:60ch;margin-top:1rem}
.cover-meta{display:flex;flex-wrap:wrap;gap:0.5rem 1.6rem;font-family:var(--font-display);font-size:0.86rem;color:var(--ink-2);margin-top:1.2rem}
.cover-meta b{color:var(--ink);font-weight:700}
.howto{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.4rem;margin:1.6rem 0}
.howto h4{margin-top:0}
.howto ul{margin-bottom:0}

/* session header */
.session{margin-top:4rem;padding-top:2rem;border-top:3px solid var(--ink)}
.session .eyebrow{margin-bottom:0.5rem}
.session .goal{color:var(--ink-2);font-size:1.05rem;margin-top:0.8rem;max-width:64ch}
.agenda{width:100%;border-collapse:collapse;font-family:var(--font-display);font-size:0.9rem;margin:1.2rem 0 0.6rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.agenda th,.agenda td{padding:0.5rem 0.8rem;text-align:left;border-top:1px solid var(--line)}
.agenda th{background:var(--surface-2);border-top:0;font-size:0.74rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-2)}
.agenda td:last-child,.agenda th:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.agenda tfoot td{font-weight:700}
.objectives{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem 1.3rem;margin:1rem 0 0}
.objectives h4{margin:0 0 0.4rem;font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-2)}
.objectives ul{margin:0}

/* section time tag */
.time{font-family:var(--font-display);font-size:0.72rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);padding:0.15rem 0.55rem;border-radius:999px;white-space:nowrap}

/* keywords */
dfn.kw{
  font-style:normal;
  font-weight:600;
  color:var(--accent-ink);
  background:var(--accent-soft);
  padding:0 0.25em;
  border-radius:3px;
  border-bottom:2px solid var(--accent);
  scroll-margin-top:24px;
}
dfn.kw:target{outline:3px solid var(--review-line);outline-offset:2px}

/* analogy + note callouts */
.note,.analogy,.demo{
  border-left:4px solid var(--note-line);
  background:var(--note);
  padding:0.8rem 1.1rem;
  border-radius:0 10px 10px 0;
  margin:1.2rem 0;
}
.note .label,.analogy .label,.demo .label,.review .label{
  font-family:var(--font-display);font-size:0.72rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-2);display:block;margin-bottom:0.3rem;
}
.note p:last-child,.analogy p:last-child,.demo p:last-child,.note ul:last-child,.demo ol:last-child,.demo ul:last-child{margin-bottom:0}
.analogy{border-left-color:var(--accent)}
.ai{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);padding:0.8rem 1.1rem;border-radius:0 10px 10px 0;margin:1.2rem 0}
.ai .label{font-family:var(--font-display);font-size:0.72rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent-ink);display:block;margin-bottom:0.3rem}
.ai p:last-child{margin-bottom:0}
.demo{border-left-style:dashed}

/* review box */
.review{
  background:var(--review);
  border:1px solid var(--review-line);
  color:var(--review-ink);
  border-radius:12px;
  padding:1.1rem 1.4rem 1rem;
  margin:2.5rem 0 1rem;
  position:relative;
  scroll-margin-top:24px;
}
.review::before{
  content:"?";
  position:absolute;top:-14px;left:16px;
  width:28px;height:28px;border-radius:50%;
  background:var(--review-line);color:#1B2430;
  font-family:var(--font-display);font-weight:800;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
}
.review .label{color:var(--review-ink);margin-top:0.2rem}
.review h4{margin:0 0 0.5rem;color:var(--review-ink)}
.review ol{margin-bottom:0.5rem}
.review li{margin-bottom:0.45rem}
.review a{color:var(--review-ink);font-weight:600}
.review .answers-link{font-family:var(--font-display);font-size:0.82rem;margin:0.4rem 0 0}
.review code{background:rgba(0,0,0,0.08)}

/* figures / diagrams */
figure{margin:1.4rem 0 1.6rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1rem 0.7rem}
figure .scroll{overflow-x:auto}
figure svg{display:block;max-width:100%;height:auto;margin:0 auto;color:var(--ink);font-family:var(--font-display)}
figcaption{font-family:var(--font-display);font-size:0.86rem;color:var(--ink-2);margin-top:0.6rem;line-height:1.45}
figcaption b{color:var(--ink)}
.d-box{fill:var(--surface-2);stroke:currentColor;stroke-width:1.2}
.d-box-plain{fill:var(--surface);stroke:currentColor;stroke-width:1.2}
.d-hi{fill:var(--diagram-hi-soft);stroke:var(--diagram-hi);stroke-width:1.6}
.d-zone{fill:none;stroke:currentColor;stroke-width:1;stroke-dasharray:5 4;opacity:0.7}
.d-line{stroke:currentColor;stroke-width:1.4;fill:none}
.d-line-hi{stroke:var(--diagram-hi);stroke-width:1.8;fill:none}
.d-line-dash{stroke:currentColor;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
.d-t{font-size:12px;fill:currentColor;font-weight:600}
.d-ts{font-size:10.5px;fill:currentColor;opacity:0.85}
.d-tl{font-size:13px;fill:currentColor;font-weight:700}
.d-th{font-size:12px;fill:var(--diagram-hi);font-weight:700}
.d-mono{font-family:var(--font-mono);font-size:10.5px;fill:currentColor}
svg.seq .d-ts,svg.seq .d-mono{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.d-num{fill:var(--diagram-hi)}
.d-numt{font-size:10px;fill:#fff;font-weight:800}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:0.93rem;margin:0.6rem 0 1.4rem;background:var(--surface);border:1px solid var(--line)}
.tbl th,.tbl td{padding:0.5rem 0.75rem;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--surface-2);font-family:var(--font-display);font-size:0.76rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-2);border-top:0}
.tbl-wrap{overflow-x:auto;margin:0.6rem 0 1.4rem}
.tbl-wrap .tbl{margin:0}
.datatable{border-collapse:collapse;font-family:var(--font-mono);font-size:0.82rem;background:var(--surface);border:1px solid var(--line);margin:0.4rem 0 1rem}
.datatable th,.datatable td{padding:0.3rem 0.7rem;border:1px solid var(--line);white-space:nowrap}
.datatable th{background:var(--surface-2);font-weight:600}
.datatable caption{caption-side:top;text-align:left;font-family:var(--font-display);font-size:0.82rem;font-weight:700;padding-bottom:0.3rem}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin:0.6rem 0 1.2rem}
.two-col>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0.8rem 1rem}
.two-col h4{margin-top:0}
.two-col ul{margin-bottom:0}

/* glossary */
.glossary{width:100%;border-collapse:collapse;font-size:0.92rem;background:var(--surface);border:1px solid var(--line)}
.glossary th,.glossary td{padding:0.5rem 0.75rem;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.glossary th{background:var(--surface-2);font-family:var(--font-display);font-size:0.76rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-2);border-top:0}
.glossary td:first-child{font-family:var(--font-display);font-weight:700;min-width:12ch;width:18%}
.glossary td:nth-child(2){width:58%;min-width:30ch}
.glossary td:last-child{font-family:var(--font-display);font-size:0.84rem;min-width:14ch;width:24%}
.glossary-letter{font-family:var(--font-display);font-weight:800;font-size:0.8rem;letter-spacing:0.1em;color:var(--ink-2);background:var(--ground)}
.glossary-letter td{border-top:2px solid var(--line)}

/* answers appendix */
.qa{margin:1.2rem 0 2rem}
.qa h4{margin-top:0}
.qa ol{padding-left:1.4rem}
.qa li{margin-bottom:0.9rem}
.qa .q{font-weight:600}
.qa .a{display:block;margin-top:0.25rem;padding:0.5rem 0.9rem;background:var(--review);border-left:3px solid var(--review-line);border-radius:0 8px 8px 0;color:var(--review-ink)}
.qa .a code{background:rgba(0,0,0,0.08)}
.backlink{font-family:var(--font-display);font-size:0.82rem}

.appendix{margin-top:4rem;padding-top:2rem;border-top:3px solid var(--ink)}

@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
@media print{
  body{background:#fff;color:#000;font-size:11pt}
  .toc{display:none}
  .page{display:block}
  main{max-width:none}
  .session,.appendix{break-before:page}
  figure,.review,pre,.note,.analogy,.demo{break-inside:avoid}
  a{color:inherit}
  dfn.kw{background:#e6f2f3}
  .review{background:#fff3d1 !important;color:#000}
}
</style>
